name: Update visit stats

on:
  schedule:
    # GitHub 的定时调度经常延迟甚至丢跑（实测有一次整天没触发），
    # 所以一天跑 4 次：脚本按日期覆盖写（幂等），当天第一个成功的运行生效。
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visit-stats
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write daily snapshot
        run: node scripts/update-visits.mjs

      - name: Commit snapshot
        run: |
          if git diff --quiet -- assets/data/visits.json; then
            echo "No snapshot change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/visits.json
          git commit -m "chore: update visit stats"
          git push
