 * module: audio —— 程序化环境音（海浪 / 风 / 列车低鸣）
 * 全部由 WebAudio 噪声与振荡器合成，无外部音频文件；
 * 首次用户手势后启动（浏览器自动播放策略），顶部一键静音。
 * ================================================================ */
function createAudio() {
  let ctx = null, master = null, rumbleGain = null, oceanGain = null, humOsc = null, humOsc2 = null;
  let started = false, muted = false;

  function makeNoise(seconds = 2) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.04 * w) / 1.04;      // 简易粉噪化，听感更柔和
      d[i] = last * 3.2;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    return src;
  }

  function init() {
    if (started) return;
    started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : CONFIG.audio.master;
    master.connect(ctx.destination);

    // 海浪：粉噪 → 低通 → 慢速 LFO 呼吸
    const ocean = makeNoise(2.5);
    const oceanLP = ctx.createBiquadFilter(); oceanLP.type = 'lowpass'; oceanLP.frequency.value = 420; oceanLP.Q.value = 0.6;
    oceanGain = ctx.createGain(); oceanGain.gain.value = 0.1;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.13;
    const lfoG = ctx.createGain(); lfoG.gain.value = 0.05;
    lfo.connect(lfoG); lfoG.connect(oceanGain.gain);
    ocean.connect(oceanLP); oceanLP.connect(oceanGain); oceanGain.connect(master);
    ocean.start(); lfo.start();

    // 风：带通噪声
    const wind = makeNoise(2);
    const windBP = ctx.createBiquadFilter(); windBP.type = 'bandpass'; windBP.frequency.value = 850; windBP.Q.value = 0.7;
    const windG = ctx.createGain(); windG.gain.value = 0.018;
    const wlfo = ctx.createOscillator(); wlfo.frequency.value = 0.07;
    const wlfoG = ctx.createGain(); wlfoG.gain.value = 0.01;
    wlfo.connect(wlfoG); wlfoG.connect(windG.gain);
    wind.connect(windBP); windBP.connect(windG); windG.connect(master);
    wind.start(); wlfo.start();

    // 列车低鸣：低通噪声 + 双振荡器低频 hum，随速度变化
    const rumble = makeNoise(2);
    const rumbleLP = ctx.createBiquadFilter(); rumbleLP.type = 'lowpass'; rumbleLP.frequency.value = 130;
    rumbleGain = ctx.createGain(); rumbleGain.gain.value = 0.05;
    rumble.connect(rumbleLP); rumbleLP.connect(rumbleGain); rumbleGain.connect(master);
    rumble.start();
    humOsc = ctx.createOscillator(); humOsc.type = 'triangle'; humOsc.frequency.value = 52;
    humOsc2 = ctx.createOscillator(); humOsc2.type = 'sine'; humOsc2.frequency.value = 104;
    const humG = ctx.createGain(); humG.gain.value = 0.016;
    humOsc.connect(humG); humOsc2.connect(humG); humG.connect(rumbleGain);
    humOsc.start(); humOsc2.start();
  }

  function setMuted(m) {
    muted = m;
    if (ctx && master) master.gain.setTargetAtTime(m ? 0 : CONFIG.audio.master, ctx.currentTime, 0.15);
  }
  /** 声音与画面联动：速度 → 低鸣强度与频率，波浪 → 海浪响度 */
  function setParams(speed, wave) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const s = clamp(speed / CONFIG.train.speedMax, 0, 1);
    rumbleGain.gain.setTargetAtTime(0.015 + s * 0.13, t, 0.3);
    humOsc.frequency.setTargetAtTime(40 + speed * 1.1, t, 0.3);
    humOsc2.frequency.setTargetAtTime(80 + speed * 2.2, t, 0.3);
    oceanGain.gain.setTargetAtTime(0.06 + wave * 0.05, t, 0.4);
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  return { init, setMuted, setParams, resume, get started() { return started; }, get muted() { return muted; } };
}

/* ================================================================
 * module: ui —— 面板绑定 / 快捷键 / 提示
 * ================================================================ */
function createUI(state, app) {
  const $ = id => document.getElementById(id);
  const els = {
    time: $('timeRange'), speed: $('speedRange'), wave: $('waveRange'), star: $('starRange'),
    bloom: $('bloomRange'), fog: $('fogRange'), auto: $('autoToggle'), quality: $('qualitySel'),
    timeVal: $('timeVal'), speedVal: $('speedVal'), waveVal: $('waveVal'), starVal: $('starVal'),
    bloomVal: $('bloomVal'), fogVal: $('fogVal'), clock: $('clock'),
    viewSeg: $('viewSeg'), toast: $('toast'), intro: $('intro'), introStatus: $('introStatus'),
    typeGrid: $('typeGrid'), typeTag: $('typeTag'), typeDesc: $('typeDesc'),
    soundBtn: $('soundBtn'), soundLabel: $('soundLabel'), fpsChip: $('fpsChip'),
    brand: $('brand'), panel: $('panel')
  };
  let timeDragging = false, toastTimer = 0;

  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1900);
  }

  const PHASES = [[0.18, '深夜'], [0.27, '黎明'], [0.4, '清晨'], [0.6, '正午'], [0.72, '午后'], [0.8, '黄昏'], [0.9, '暮色'], [1.01, '深夜']];
  function timeText(t) {
    const mins = Math.floor(t * 24 * 60);
    const hh = String(Math.floor(mins / 60)).padStart(2, '0');
    const mm = String(mins % 60).padStart(2, '0');
    const phase = PHASES.find(p => t < p[0])[1];
    return { hhmm: `${hh}:${mm}`, phase };
  }

  /* ---- 滑块 ---- */
  els.time.addEventListener('input', () => { state.time = parseFloat(els.time.value); timeDragging = true; });
  const endDrag = () => { timeDragging = false; };
  els.time.addEventListener('change', endDrag);
  els.time.addEventListener('pointerup', endDrag);
  els.time.addEventListener('touchend', endDrag);
  els.speed.addEventListener('input', () => { state.speed = parseFloat(els.speed.value); syncLabels(); });
  els.wave.addEventListener('input', () => { state.waveAmp = parseFloat(els.wave.value); syncLabels(); });
  els.star.addEventListener('input', () => { state.starDensity = parseFloat(els.star.value); app.sky.setDensity(state.starDensity); syncLabels(); });
  els.bloom.addEventListener('input', () => { state.bloom = parseFloat(els.bloom.value); app.bloomPass.strength = state.bloom; syncLabels(); });
  els.fog.addEventListener('input', () => { state.fog = parseFloat(els.fog.value); syncLabels(); });

  /* ---- 开关 / 画质 ---- */
  function setAuto(v) {
    state.auto = v;
    els.auto.classList.toggle('on', v);
    els.auto.setAttribute('aria-checked', String(v));
  }
  els.auto.addEventListener('click', () => setAuto(!state.auto));
  els.quality.addEventListener('change', () => {
    state.quality = els.quality.value;
    app.setQuality(state.quality);
  });

  /* ---- 视角 ---- */
  els.viewSeg.addEventListener('click', e => {
    const btn = e.target.closest('button[data-view]');
    if (btn) app.flyTo(btn.dataset.view);
  });
  function setViewActive(name) {
    for (const b of els.viewSeg.querySelectorAll('button')) b.classList.toggle('active', b.dataset.view === name);
  }

  /* ---- 车型选择 ---- */
  CONFIG.trainTypes.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t.name; b.dataset.type = t.id;
    if (i === CONFIG.trainTypes.length - 1 && CONFIG.trainTypes.length % 2 === 1) b.classList.add('span2');
    b.addEventListener('click', () => app.setTrainType(t.id));
    els.typeGrid.appendChild(b);
  });
  function syncTrain() {
    const sp = app.train.spec;
    for (const b of els.typeGrid.querySelectorAll('button')) b.classList.toggle('active', b.dataset.type === sp.id);
    els.typeTag.textContent = sp.tag;
    els.typeDesc.textContent = sp.desc;
  }

  /* ---- 动作按钮 ---- */
  $('resetBtn').addEventListener('click', () => { app.reset(); toast('已重置为默认氛围'); });
  $('randomBtn').addEventListener('click', () => { app.randomize(); toast('已应用随机氛围'); });
  $('shotBtn').addEventListener('click', () => { app.screenshot(); toast('截图已保存'); });

  /* ---- 声音 ---- */
  function syncSound() {
    els.soundBtn.classList.toggle('muted', state.muted);
    els.soundLabel.textContent = state.muted ? '声音 关' : '声音 开';
  }
  els.soundBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    app.audio.init(); app.audio.resume();
    app.audio.setMuted(state.muted);
    syncSound();
  });
  // 首次任意交互 → 启动环境音（遵守自动播放策略）
  const bootAudio = () => {
    if (!app.audio.started && !state.muted) { app.audio.init(); app.audio.resume(); }
    removeEventListener('pointerdown', bootAudio);
    removeEventListener('keydown', bootAudio);
  };
  addEventListener('pointerdown', bootAudio);
  addEventListener('keydown', bootAudio);

  /* ---- 快捷键 ---- */
  addEventListener('keydown', e => {
    if (e.code === 'Digit1') app.flyTo('far');
    else if (e.code === 'Digit2') app.flyTo('side');
    else if (e.code === 'Digit3') app.flyTo('interior');
    else if (e.code === 'Space') {
      if (e.target.closest && e.target.closest('input,select,button,textarea')) return;
      e.preventDefault();
      setAuto(!state.auto);
      toast(state.auto ? '昼夜循环 继续' : '昼夜循环 暂停');
    }
  });

  /* ---- 首屏 ---- */
  function dismissIntro() {
    els.intro.classList.add('hide');
    els.panel.classList.add('show');   // 控制台随标题淡出后登场，入场更有层次
  }
  els.intro.addEventListener('click', dismissIntro);
  setTimeout(dismissIntro, 6000);

  function syncLabels() {
    els.speedVal.textContent = `${Math.round(state.speed * 3.6)} km/h`;
    els.waveVal.textContent = `${Math.round(state.waveAmp / CONFIG.ocean.waveAmpMax * 160)}%`;
    els.starVal.textContent = `${Math.round(state.starDensity * 100)}%`;
    els.bloomVal.textContent = state.bloom.toFixed(2);
    els.fogVal.textContent = `${(state.fog * 1000).toFixed(1)}‰`;
  }
  /** 把 state 同步回全部控件（重置 / 随机 / 自动推进时调用） */
  function syncAll() {
    els.time.value = state.time;
    els.speed.value = state.speed;
    els.wave.value = state.waveAmp;
    els.star.value = state.starDensity;
    els.bloom.value = state.bloom;
    els.fog.value = state.fog;
    els.quality.value = state.quality;
    setAuto(state.auto);
    syncSound();
    syncLabels();
  }
  /** 每帧轻量刷新：时间滑块与时钟（拖动中不回写滑块） */
  function tick() {
    if (!timeDragging) els.time.value = state.time;
    const { hhmm, phase } = timeText(state.time);
    els.timeVal.textContent = hhmm;
    els.clock.textContent = `${hhmm} · ${phase}`;
  }
  function setFps(fps) {
    els.fpsChip.querySelector('b').textContent = fps;
    els.fpsChip.classList.toggle('warn', fps < 55 && fps >= 30);
    els.fpsChip.classList.toggle('bad', fps < 30);
  }
  function revealChrome() {
    els.brand.classList.add('show');
    els.introStatus.style.display = 'none';
  }
  syncAll();
  syncTrain();
  return { tick, setFps, setViewActive, syncAll, syncTrain, toast, revealChrome, dismissIntro };
}

/* ================================================================
 * 主程序：组装各模块 + 渲染循环
 * ================================================================ */
const { renderer, scene, camera, composer, bloomPass, hemi, sunLight, moonLight } = createScene();
const dayNight = createDayNight();
const sky = createSky(scene);
const ocean = createOcean(scene);
let train = createTrain(scene, CONFIG.trainTypes[0].id);
const ctl = createControls(camera, renderer.domElement, () => train);
const audio = createAudio();

const state = {
  time: CONFIG.dayNight.startTime,
  auto: CONFIG.dayNight.auto,
  speed: CONFIG.train.speed,
  waveAmp: CONFIG.ocean.waveAmp,
  starDensity: 1,
  bloom: CONFIG.bloom.strength,
  fog: CONFIG.fog.density,
  quality: 'high',
  muted: false,
  travel: 0
};

const app = {
  sky, bloomPass, audio, renderer, scene, camera, controls: ctl, ocean, train,
  flyTo: name => ctl.flyTo(name),
  setQuality(q) {
    const pr = Math.min(devicePixelRatio, CONFIG.quality[q]);
    renderer.setPixelRatio(pr);
    composer.setPixelRatio(pr);
    train.setPixelRatio(pr);
    train.setSprayDensity(q === 'high' ? 1 : q === 'mid' ? 0.75 : 0.5);
    ctl.interact();
    app.resize();
  },
  /** 切换车型：重建程序化车体并释放旧资源 */
  setTrainType(id) {
    if (train.spec.id === id) return;
    const old = train;
    train = createTrain(scene, id);
    old.dispose();
    app.train = train;
    train.setPixelRatio(renderer.getPixelRatio());
    train.setSprayDensity(state.quality === 'high' ? 1 : state.quality === 'mid' ? 0.75 : 0.5);
    if (ctl.mode === 'interior') ctl.flyTo('interior');
    ui.syncTrain();
    ui.toast(`已切换车型 · ${train.spec.name}`);
  },
  resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    composer.setSize(innerWidth, innerHeight);
  },
  reset() {
    state.time = CONFIG.dayNight.startTime; state.auto = CONFIG.dayNight.auto;
    state.speed = CONFIG.train.speed; state.waveAmp = CONFIG.ocean.waveAmp;
    state.starDensity = 1; state.bloom = CONFIG.bloom.strength; state.fog = CONFIG.fog.density;
    state.quality = 'high';
    bloomPass.strength = state.bloom; sky.setDensity(1);
    app.setQuality('high');
    ui.syncAll();
  },
  randomize() {
    state.time = Math.random();
    state.waveAmp = rand(0.4, CONFIG.ocean.waveAmpMax);
    state.fog = rand(0.0008, 0.003);
    state.bloom = rand(0.5, 1.4);
    state.starDensity = rand(0.65, 1);
    bloomPass.strength = state.bloom; sky.setDensity(state.starDensity);
    ui.syncAll();
  },
  screenshot() {
    composer.render();   // 同帧立即读取，无需 preserveDrawingBuffer
    const url = renderer.domElement.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = url; a.download = '海上列车-驶向星空.png';
    a.click();
  },
  // 调试 / 自动化测试接口
  setTime(t) { state.time = clamp(t, 0, 1); ui.tick(); },
  getTime: () => state.time,
  setView: name => ctl.flyTo(name),
  getView: () => ctl.mode
};
app.resize = app.resize.bind(app);

const ui = createUI(state, app);
ctl.onViewChange = name => ui.setViewActive(name);
addEventListener('resize', app.resize);

// 灯光 / 雾 / 环境强度随昼夜采样结果更新
const _hemiSky = new THREE.Color(), _white = new THREE.Color('#ffffff');
function applyDayNight(dn) {
  _hemiSky.copy(dn.zen).lerp(_white, 0.22);
  hemi.color.copy(_hemiSky);
  hemi.groundColor.copy(dn.deep);
  hemi.intensity = dn.hemiI;
  sunLight.color.copy(dn.sunColor);
  sunLight.intensity = dn.sunI * dn.dayBlend;
  sunLight.position.copy(dn.sunDir).multiplyScalar(700);
  moonLight.intensity = 0.62 * (1 - dn.dayBlend);
  moonLight.position.copy(dn.moonDir).multiplyScalar(700);
  scene.fog.color.copy(dn.fog);
  scene.fog.density = state.fog;
  scene.environmentIntensity = 0.18 + dn.dayBlend * 0.45;
  renderer.toneMappingExposure = 1.0 + dn.dayBlend * 0.06;
}

let last = performance.now();
let elapsed = 0, fpsFrames = 0, fpsTime = 0, audioTime = 0;

function loop(forcedDt) {
  const now = performance.now();
  const dt = forcedDt !== undefined ? forcedDt : Math.min((now - last) / 1000, 0.05);   // 切后台回来不产生时间跳变
  last = now;
  elapsed += dt;

  // 昼夜自动推进（拖动滑块时临时暂停）
  if (state.auto && !document.hidden) {
    state.time = (state.time + dt / CONFIG.dayNight.cycleSeconds) % 1;
  }
  const dn = dayNight.sample(state.time);

  // 世界流动：列车匀速前进的跑步机偏移
  state.travel += state.speed * dt;

  applyDayNight(dn);
  sky.update(elapsed, dn, renderer.getPixelRatio(), dt);
  ocean.update(elapsed, state.travel, dn, camera.position, state.waveAmp, state.fog, train.glowColor, train.lampX);
  train.update(dt, elapsed, state.travel, state.speed, dn);
  ctl.update(dt);

  // 声音参数节流联动
  audioTime += dt;
  if (audioTime > 0.25) { audio.setParams(state.speed, state.waveAmp); audioTime = 0; }

  composer.render();

  // UI 与 FPS
  ui.tick();
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5) {
    ui.setFps(Math.round(fpsFrames / fpsTime));
    fpsFrames = 0; fpsTime = 0;
  }
}

renderer.setAnimationLoop(() => loop());

// 启动完成：揭开标题与控制台
window.__booted = true;
window.__seaTrain = app;
app.forceFrame = dt => loop(dt);   // 确定性单步（后台/自动化测试用）
ui.revealChrome();
</script>
</body>
</html>
